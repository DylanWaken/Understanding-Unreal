<text x="40" y="49" font-size="28" fill="#eef4ff" text-anchor="start">Refine directional cells that matter</text>
<text x="40" y="588" font-size="16" fill="#a7b9d3" text-anchor="start">SCHEMATIC</text>
<text x="80" y="120" font-size="24" fill="#eef4ff" text-anchor="start">coarse equal-area cells</text>
<text x="880" y="200" font-size="24" fill="#ffd36f" text-anchor="start">rank by BRDF</text>
<text x="880" y="229" font-size="24" fill="#ffd36f" text-anchor="start">and lighting guide</text>
<text x="880" y="258" font-size="24" fill="#ffd36f" text-anchor="start">3 low slots +</text>
<text x="880" y="287" font-size="24" fill="#ffd36f" text-anchor="start">1 high cell</text>
<text x="880" y="316" font-size="24" fill="#ffd36f" text-anchor="start">→ 4 child cells</text>
<text x="90" y="495" font-size="20" fill="#ff8c91" text-anchor="start">×: trace slots reassigned to the four children</text>
<text x="100" y="525" font-size="25" fill="#eef4ff" text-anchor="start">Use the ranking PDF to select cells. Reconstruct from their radiance.</text>
</g></svg>
