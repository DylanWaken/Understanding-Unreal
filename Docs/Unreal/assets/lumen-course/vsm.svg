<text x="456" y="297" font-size="19" fill="#a7b9d3" text-anchor="start">→ physical tile</text>
<text x="456" y="326" font-size="19" fill="#a7b9d3" text-anchor="start">+ valid / cached bits</text>
<text x="780" y="150" font-size="23" fill="#eef4ff" text-anchor="start">physical depth pool</text>
<text x="75" y="465" font-size="24" fill="#eef4ff" text-anchor="start">Compare receiver depth with the correct physical texel.</text>
<text x="75" y="494" font-size="24" fill="#eef4ff" text-anchor="start">Bias, filtering, missing layers, and stale pages change visibility.</text>
