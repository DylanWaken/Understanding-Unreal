<text x="40" y="49" font-size="28" fill="#eef4ff" text-anchor="start">Virtual shadow depth: request, map, render, compare</text>
<text x="40" y="588" font-size="16" fill="#a7b9d3" text-anchor="start">SCHEMATIC · geometry and colors explain a model; this is not an Unreal buffer</text>
<text x="70" y="125" font-size="23" fill="#65baff" text-anchor="start">logical light-space pages</text>
<text x="456" y="234" font-size="23" fill="#6ce1b5" text-anchor="start">page table</text>
