<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Unroll transport into complete paths</title><desc id="desc">A light-to-sensor path scatters from a vertical wall to a horizontal floor and then reaches a camera. Every scattering edge has a nonzero geometric cosine.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1200" height="620" rx="12" fill="#101b2d"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif">
<path d="M75 450L805 450" stroke="#a7b9d3" stroke-width="5" fill="none"/>
<path d="M805 170L805 450" stroke="#a7b9d3" stroke-width="5" fill="none"/>
<path d="M500 150L805 290" stroke="#ffd36f" stroke-width="4" fill="none"/>
<path d="M628.1 208.8L689.1 236.8" stroke="#ffd36f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M805 290L430 450" stroke="#ffd36f" stroke-width="4" fill="none"/>
<path d="M647.5 357.2L572.5 389.2" stroke="#ffd36f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M430 450L165 340" stroke="#ffd36f" stroke-width="4" fill="none"/>
<path d="M318.7 403.8L265.7 381.8" stroke="#ffd36f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M500 150L165 340" stroke="#65baff" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<path d="M805 290L745 290" stroke="#6ce1b5" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M430 450L430 385" stroke="#6ce1b5" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<circle cx="500" cy="150" r="8" stroke="#6ce1b5" stroke-width="2" fill="#6ce1b5"/>
<circle cx="805" cy="290" r="8" stroke="#6ce1b5" stroke-width="2" fill="#6ce1b5"/>
<circle cx="430" cy="450" r="8" stroke="#6ce1b5" stroke-width="2" fill="#6ce1b5"/>
<circle cx="165" cy="340" r="8" stroke="#c4a0ff" stroke-width="2" fill="#c4a0ff"/>
<text x="40" y="49" font-size="28" fill="#eef4ff" text-anchor="start">Unroll transport into complete paths</text>
<text x="40" y="588" font-size="16" fill="#a7b9d3" text-anchor="start">SCHEMATIC · geometry and colors explain a model; this is not an Unreal buffer</text>
<text x="500" y="120" font-size="22" fill="#6ce1b5" text-anchor="start">x₀ · emitter</text>
<text x="820" y="285" font-size="22" fill="#6ce1b5" text-anchor="start">x₁ · wall</text>
<text x="435" y="487" font-size="22" fill="#6ce1b5" text-anchor="start">x₂ · floor</text>
<text x="65" y="310" font-size="22" fill="#c4a0ff" text-anchor="start">x₃ · camera</text>
<text x="865" y="355" font-size="19" fill="#eef4ff" text-anchor="start">Along the gold path:</text>
<text x="865" y="384" font-size="19" fill="#eef4ff" text-anchor="start">emission</text>
<text x="865" y="413" font-size="19" fill="#eef4ff" text-anchor="start">× two scattering factors</text>
<text x="865" y="442" font-size="19" fill="#eef4ff" text-anchor="start">× three geometry factors</text>
<text x="865" y="471" font-size="19" fill="#eef4ff" text-anchor="start">× sensor response</text>
<text x="75" y="535" font-size="24" fill="#eef4ff" text-anchor="start">Blue: direct visibility. Gold: wall → floor → camera.</text>
</g></svg>
