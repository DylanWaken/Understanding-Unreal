<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Probe interpolation across a wall</title><desc id="desc">Probes separated by a wall cannot be mixed using distance alone; depth and directional validity are necessary.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1200" height="620" rx="12" fill="#101b2d"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif">
<rect x="555" y="135" width="45" height="330" rx="5" stroke="#eef4ff" stroke-width="2" fill="#455165"/>
<circle cx="180" cy="200" r="12" stroke="#65baff" stroke-width="2" fill="#65baff"/>
<circle cx="180" cy="390" r="12" stroke="#65baff" stroke-width="2" fill="#65baff"/>
<circle cx="350" cy="200" r="12" stroke="#65baff" stroke-width="2" fill="#65baff"/>
<circle cx="350" cy="390" r="12" stroke="#65baff" stroke-width="2" fill="#65baff"/>
<circle cx="800" cy="200" r="12" stroke="#ffd36f" stroke-width="2" fill="#ffd36f"/>
<circle cx="800" cy="390" r="12" stroke="#ffd36f" stroke-width="2" fill="#ffd36f"/>
<circle cx="980" cy="200" r="12" stroke="#ffd36f" stroke-width="2" fill="#ffd36f"/>
<circle cx="980" cy="390" r="12" stroke="#ffd36f" stroke-width="2" fill="#ffd36f"/>
<path d="M350 200L470 300" stroke="#65baff" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M350 390L470 300" stroke="#65baff" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M800 200L470 300" stroke="#ff8c91" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<path d="M800 390L470 300" stroke="#ff8c91" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<path d="M567 259L587 277" stroke="#ff8c91" stroke-width="4" fill="none"/>
<path d="M587 259L567 277" stroke="#ff8c91" stroke-width="4" fill="none"/>
<path d="M567 320L587 338" stroke="#ff8c91" stroke-width="4" fill="none"/>
<path d="M587 320L567 338" stroke="#ff8c91" stroke-width="4" fill="none"/>
<circle cx="470" cy="300" r="10" stroke="#6ce1b5" stroke-width="2" fill="#6ce1b5"/>
<text x="40" y="49" font-size="28" fill="#eef4ff" text-anchor="start">Probe interpolation across a wall</text>
<text x="40" y="588" font-size="16" fill="#a7b9d3" text-anchor="start">SCHEMATIC</text>
<text x="155" y="100" font-size="25" fill="#65baff" text-anchor="start">shaded arcade</text>
<text x="800" y="100" font-size="25" fill="#ffd36f" text-anchor="start">sunlit courtyard</text>
<text x="600" y="505" font-size="22" fill="#ff8c91" text-anchor="middle">Cross-wall candidates must be rejected</text>
<text x="600" y="545" font-size="27" fill="#6ce1b5" text-anchor="middle">Normalized weights can still blend across a wall.</text>
</g></svg>
