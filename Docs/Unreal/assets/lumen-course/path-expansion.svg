<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">One substitution adds one scattering event</title><desc id="desc">Each row is a full integral over its vertex positions. Light flows left to right. Each added scattering vertex adds an area variable, a BSDF factor, and a geometry factor. A remainder retains longer paths.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1200" height="620" rx="12" fill="#101b2d"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif">
<path d="M172 160L1016 160" stroke="#ffd36f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<circle cx="160" cy="160" r="10" stroke="#ffd36f" stroke-width="2" fill="#ffd36f"/>
<circle cx="1030" cy="160" r="10" stroke="#c4a0ff" stroke-width="2" fill="#c4a0ff"/>
<path d="M172 300L581 300" stroke="#ffd36f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M607 300L1016 300" stroke="#ffd36f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<circle cx="160" cy="300" r="10" stroke="#ffd36f" stroke-width="2" fill="#ffd36f"/>
<circle cx="595" cy="300" r="10" stroke="#6ce1b5" stroke-width="2" fill="#6ce1b5"/>
<circle cx="1030" cy="300" r="10" stroke="#c4a0ff" stroke-width="2" fill="#c4a0ff"/>
<path d="M172 440L436 440" stroke="#ffd36f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M462 440L726 440" stroke="#ffd36f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M752 440L1016 440" stroke="#ffd36f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<circle cx="160" cy="440" r="10" stroke="#ffd36f" stroke-width="2" fill="#ffd36f"/>
<circle cx="450" cy="440" r="10" stroke="#6ce1b5" stroke-width="2" fill="#6ce1b5"/>
<circle cx="740" cy="440" r="10" stroke="#6ce1b5" stroke-width="2" fill="#6ce1b5"/>
<circle cx="1030" cy="440" r="10" stroke="#c4a0ff" stroke-width="2" fill="#c4a0ff"/>
<text x="40" y="49" font-size="28" fill="#eef4ff" text-anchor="start">One substitution adds one scattering event</text>
<text x="40" y="588" font-size="16" fill="#a7b9d3" text-anchor="start">SCHEMATIC</text>
<text x="40" y="120" font-size="21" fill="#a7b9d3" text-anchor="start">k = 1  ·  0 scattering events</text>
<text x="595" y="144" font-size="22" fill="#ffd36f" text-anchor="middle">G₀₁</text>
<text x="160" y="194" font-size="22" fill="#ffd36f" text-anchor="middle">x₀</text>
<text x="160" y="222" font-size="21" fill="#ffd36f" text-anchor="middle">emission Lₑ</text>
<text x="1030" y="194" font-size="22" fill="#c4a0ff" text-anchor="middle">x₁</text>
<text x="1030" y="222" font-size="21" fill="#c4a0ff" text-anchor="middle">sensor Wₑ</text>
<text x="40" y="260" font-size="21" fill="#a7b9d3" text-anchor="start">k = 2  ·  1 scattering event</text>
<text x="377.5" y="284" font-size="22" fill="#ffd36f" text-anchor="middle">G₀₁</text>
<text x="812.5" y="284" font-size="22" fill="#ffd36f" text-anchor="middle">G₁₂</text>
<text x="160" y="334" font-size="22" fill="#ffd36f" text-anchor="middle">x₀</text>
<text x="160" y="362" font-size="21" fill="#ffd36f" text-anchor="middle">emission Lₑ</text>
<text x="595" y="334" font-size="22" fill="#6ce1b5" text-anchor="middle">x₁</text>
<text x="595" y="362" font-size="21" fill="#6ce1b5" text-anchor="middle">scatter fₛ</text>
<text x="1030" y="334" font-size="22" fill="#c4a0ff" text-anchor="middle">x₂</text>
<text x="1030" y="362" font-size="21" fill="#c4a0ff" text-anchor="middle">sensor Wₑ</text>
<text x="40" y="400" font-size="21" fill="#a7b9d3" text-anchor="start">k = 3  ·  2 scattering events</text>
<text x="305" y="424" font-size="22" fill="#ffd36f" text-anchor="middle">G₀₁</text>
<text x="595" y="424" font-size="22" fill="#ffd36f" text-anchor="middle">G₁₂</text>
<text x="885" y="424" font-size="22" fill="#ffd36f" text-anchor="middle">G₂₃</text>
<text x="160" y="474" font-size="22" fill="#ffd36f" text-anchor="middle">x₀</text>
<text x="160" y="502" font-size="21" fill="#ffd36f" text-anchor="middle">emission Lₑ</text>
<text x="450" y="474" font-size="22" fill="#6ce1b5" text-anchor="middle">x₁</text>
<text x="450" y="502" font-size="21" fill="#6ce1b5" text-anchor="middle">scatter fₛ</text>
<text x="740" y="474" font-size="22" fill="#6ce1b5" text-anchor="middle">x₂</text>
<text x="740" y="502" font-size="21" fill="#6ce1b5" text-anchor="middle">scatter fₛ</text>
<text x="1030" y="474" font-size="22" fill="#c4a0ff" text-anchor="middle">x₃</text>
<text x="1030" y="502" font-size="21" fill="#c4a0ff" text-anchor="middle">sensor Wₑ</text>
<text x="40" y="548" font-size="22" fill="#eef4ff" text-anchor="start">Integrate each row over all its vertices. Sum the rows; retain the unresolved tail.</text>
</g></svg>
