<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Radiance resolves both position and direction</title><desc id="desc">A ray bundle crossing a tilted patch has a projected footprint. Radiance is power per projected area and solid angle.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1200" height="620" rx="12" fill="#101b2d"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif">
<polygon points="134.025,421.06 419.025,421.06 495.975,468.94 210.975,468.94" stroke="#65baff" stroke-width="2" fill="#1d3851"/>
<path d="M88.620 341.540 L304.346 220.217 L388.224 280.229 L172.497 401.552 Z" stroke="#ffd36f" stroke-width="2" fill="none" stroke-dasharray="7 7"/>
<path d="M65.3712 224.104L191.5 445" stroke="#ffd36f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M150.871 224.104L277 445" stroke="#ffd36f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M236.371 224.104L362.5 445" stroke="#ffd36f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M321.871 224.104L448 445" stroke="#ffd36f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M315 445L315 207.5" stroke="#6ce1b5" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M392.224 280.229L415 320" stroke="#ffd36f" stroke-width="2" fill="none"/>
<path d="M640 310L1070 310" stroke="#a7b9d3" stroke-width="2" fill="none"/>
<text x="40" y="49" font-size="28" fill="#eef4ff" text-anchor="start">Radiance resolves both position and direction</text>
<text x="40" y="588" font-size="16" fill="#a7b9d3" text-anchor="start">SCHEMATIC</text>
<text x="330" y="205" font-size="20" fill="#6ce1b5" text-anchor="start">geometric normal</text>
<text x="135" y="520" font-size="23" fill="#65baff" text-anchor="start">surface patch dA</text>
<text x="425" y="300" font-size="19" fill="#ffd36f" text-anchor="start">projected</text>
<text x="425" y="325" font-size="19" fill="#ffd36f" text-anchor="start">area</text>
<text x="55" y="118" font-size="23" fill="#eef4ff" text-anchor="start">A narrow cone crosses a tilted patch</text>
<text x="630" y="190" font-size="27" fill="#eef4ff" text-anchor="start">power through the patch</text>
<text x="630" y="219" font-size="27" fill="#eef4ff" text-anchor="start">÷ projected patch area</text>
<text x="630" y="248" font-size="27" fill="#eef4ff" text-anchor="start">÷ cone solid angle</text>
<text x="640" y="360" font-size="28" fill="#ffd36f" text-anchor="start">L = dΦ / (dA · |cos θ| · dσ)</text>
<text x="640" y="415" font-size="21" fill="#a7b9d3" text-anchor="start">Irradiance integrates over directions.</text>
<text x="640" y="444" font-size="21" fill="#a7b9d3" text-anchor="start">Radiance keeps those directions separate.</text>
</g></svg>
