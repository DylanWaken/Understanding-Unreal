<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">The GBuffer stores the first surface interaction</title><desc id="desc">Depth and material attributes let multiple lighting paths share the primary visible surface.</desc>
