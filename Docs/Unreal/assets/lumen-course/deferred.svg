<path d="M730 175L795 175" stroke="#eef4ff" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M730 410L795 410" stroke="#eef4ff" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="810" y="120" width="315" height="110" rx="5" stroke="#ffd36f" stroke-width="2" fill="#18283e"/>
<rect x="810" y="355" width="315" height="110" rx="5" stroke="#6ce1b5" stroke-width="2" fill="#18283e"/>
<text x="40" y="49" font-size="28" fill="#eef4ff" text-anchor="start">The GBuffer stores the first surface interaction</text>
<text x="40" y="588" font-size="16" fill="#a7b9d3" text-anchor="start">SCHEMATIC · geometry and colors explain a model; this is not an Unreal buffer</text>
<text x="381" y="144" font-size="23" fill="#a7b9d3" text-anchor="start">depth</text>
<text x="381" y="239" font-size="23" fill="#6ce1b5" text-anchor="start">normal</text>
<text x="381" y="334" font-size="23" fill="#ffd36f" text-anchor="start">base color</text>
<text x="381" y="429" font-size="23" fill="#c4a0ff" text-anchor="start">roughness / metal</text>
<text x="826" y="154" font-size="23" fill="#ffd36f" text-anchor="start">Direct lights</text>
<text x="826" y="188" font-size="19" fill="#a7b9d3" text-anchor="start">BSDF + source + visibility</text>
<text x="826" y="389" font-size="23" fill="#6ce1b5" text-anchor="start">Lumen</text>
<text x="826" y="423" font-size="19" fill="#a7b9d3" text-anchor="start">remaining incoming field</text>
<text x="50" y="500" font-size="25" fill="#eef4ff" text-anchor="start">Material state is reused. Lighting ownership stays separate.</text>
</g></svg>
