<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">History must still describe the same surface</title><desc id="desc">A moving view reveals a surface hidden in the prior frame. Per-tap depth and normal checks distinguish valid history from the old occluder.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1200" height="620" rx="12" fill="#101b2d"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif">
<rect x="55" y="145" width="465" height="320" rx="5" stroke="#65baff" stroke-width="2" fill="#1c3147"/>
<rect x="265" y="145" width="85" height="320" rx="5" stroke="#eef4ff" stroke-width="2" fill="#4a5469"/>
<circle cx="335" cy="220" r="7" stroke="#ff8c91" stroke-width="2" fill="#ff8c91"/>
<circle cx="385" cy="220" r="7" stroke="#6ce1b5" stroke-width="2" fill="#6ce1b5"/>
<circle cx="335" cy="280" r="7" stroke="#ff8c91" stroke-width="2" fill="#ff8c91"/>
<circle cx="385" cy="280" r="7" stroke="#6ce1b5" stroke-width="2" fill="#6ce1b5"/>
<rect x="675" y="145" width="465" height="320" rx="5" stroke="#65baff" stroke-width="2" fill="#1c3147"/>
<rect x="785" y="145" width="85" height="320" rx="5" stroke="#eef4ff" stroke-width="2" fill="#4a5469"/>
<circle cx="955" cy="220" r="7" stroke="#6ce1b5" stroke-width="2" fill="#6ce1b5"/>
<circle cx="1005" cy="220" r="7" stroke="#6ce1b5" stroke-width="2" fill="#6ce1b5"/>
<circle cx="955" cy="280" r="7" stroke="#6ce1b5" stroke-width="2" fill="#6ce1b5"/>
<circle cx="1005" cy="280" r="7" stroke="#6ce1b5" stroke-width="2" fill="#6ce1b5"/>
<path d="M535 305L655 305" stroke="#c4a0ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<text x="40" y="49" font-size="28" fill="#eef4ff" text-anchor="start">History must still describe the same surface</text>
<text x="40" y="588" font-size="16" fill="#a7b9d3" text-anchor="start">SCHEMATIC</text>
<text x="55" y="110" font-size="25" fill="#eef4ff" text-anchor="start">previous frame</text>
<text x="675" y="110" font-size="25" fill="#eef4ff" text-anchor="start">current frame</text>
<text x="600" y="510" font-size="24" fill="#eef4ff" text-anchor="middle">Red: reject old-column taps. Green: keep valid stone taps.</text>
<text x="600" y="545" font-size="22" fill="#6ce1b5" text-anchor="middle">Renormalize surviving weights; reset if none survive.</text>
</g></svg>
