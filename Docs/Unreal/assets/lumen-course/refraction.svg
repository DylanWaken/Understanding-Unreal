<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">An interface changes the ray, not the accounting law</title><desc id="desc">Physical propagation arrows reflect symmetrically or refract according to the stationary optical path and Snell law.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1200" height="620" rx="12" fill="#101b2d"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif">
<rect x="45" y="310" width="680" height="230" rx="5" stroke="#65baff" stroke-width="2" fill="#17334a"/>
<path d="M45 310L725 310" stroke="#65baff" stroke-width="3" fill="none"/>
<path d="M390 100 L390 540" stroke="#a7b9d3" stroke-width="2" fill="none" stroke-dasharray="7 7"/>
<path d="M195 115L390 310" stroke="#ffd36f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M390 310L585 115" stroke="#ffd36f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M390 310L507.6 530" stroke="#6ce1b5" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<text x="40" y="49" font-size="28" fill="#eef4ff" text-anchor="start">An interface changes the ray, not the accounting law</text>
<text x="40" y="588" font-size="16" fill="#a7b9d3" text-anchor="start">SCHEMATIC · geometry and colors explain a model; this is not an Unreal buffer</text>
<text x="70" y="90" font-size="24" fill="#ffd36f" text-anchor="start">incident beam</text>
<text x="520" y="90" font-size="24" fill="#ffd36f" text-anchor="start">reflected beam</text>
<text x="535" y="480" font-size="23" fill="#6ce1b5" text-anchor="start">transmitted</text>
<text x="65" y="270" font-size="24" fill="#eef4ff" text-anchor="start">air: η = 1</text>
<text x="65" y="360" font-size="24" fill="#eef4ff" text-anchor="start">glass: η = 1.5</text>
<text x="413" y="150" font-size="20" fill="#a7b9d3" text-anchor="start">normal</text>
<text x="775" y="180" font-size="23" fill="#eef4ff" text-anchor="start">stationary optical length</text>
<text x="775" y="209" font-size="23" fill="#eef4ff" text-anchor="start">ηᵢ sin θᵢ = ηₜ sin θₜ</text>
<text x="775" y="238" font-size="23" fill="#eef4ff" text-anchor="start"></text>
<text x="775" y="267" font-size="23" fill="#eef4ff" text-anchor="start">45° in air → 28.1° in glass</text>
<text x="775" y="296" font-size="23" fill="#eef4ff" text-anchor="start"></text>
<text x="775" y="325" font-size="23" fill="#eef4ff" text-anchor="start">All angles use the normal.</text>
<text x="775" y="354" font-size="23" fill="#eef4ff" text-anchor="start">Arrows here follow light.</text>
</g></svg>
