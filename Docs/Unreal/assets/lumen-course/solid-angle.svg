<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">How distance changes solid angle</title><desc id="desc">Two source positions show the geometric origin of inverse-square irradiance.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1200" height="620" rx="12" fill="#101b2d"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif">
<path d="M440 240L440 360" stroke="#ffd36f" stroke-width="8" fill="none"/>
<path d="M140 300L440 240" stroke="#65baff" stroke-width="2" fill="none"/>
<path d="M140 300L440 360" stroke="#65baff" stroke-width="2" fill="none"/>
<path d="M740 240L740 360" stroke="#ffd36f" stroke-width="8" fill="none"/>
<path d="M140 300L740 240" stroke="#65baff" stroke-width="2" fill="none"/>
<path d="M140 300L740 360" stroke="#65baff" stroke-width="2" fill="none"/>
<circle cx="140" cy="300" r="8" stroke="#6ce1b5" stroke-width="2" fill="#6ce1b5"/>
<path d="M235 281 Q245 300 235 319" stroke="#ffd36f" stroke-width="4" fill="none"/>
<text x="40" y="49" font-size="28" fill="#eef4ff" text-anchor="start">How distance changes solid angle</text>
<text x="40" y="588" font-size="16" fill="#a7b9d3" text-anchor="start">SCHEMATIC</text>
<text x="440" y="200" font-size="21" fill="#ffd36f" text-anchor="middle">same area</text>
<text x="440" y="410" font-size="23" fill="#eef4ff" text-anchor="middle">distance r</text>
<text x="740" y="200" font-size="21" fill="#ffd36f" text-anchor="middle">same area</text>
<text x="740" y="410" font-size="23" fill="#eef4ff" text-anchor="middle">distance 2r</text>
<text x="60" y="350" font-size="23" fill="#6ce1b5" text-anchor="start">receiver x</text>
<text x="80" y="110" font-size="27" fill="#eef4ff" text-anchor="start">Fixed source area: apparent solid angle ∝ 1 / r²</text>
<text x="80" y="480" font-size="22" fill="#a7b9d3" text-anchor="start">The two outlines show the same source at different distances.</text>
<text x="80" y="509" font-size="22" fill="#a7b9d3" text-anchor="start">L stays fixed. At 2r, a small source occupies about one quarter the solid angle.</text>
</g></svg>
