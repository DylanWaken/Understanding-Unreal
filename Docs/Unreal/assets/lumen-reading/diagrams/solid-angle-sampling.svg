<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" width="1100" height="760" role="img" aria-labelledby="title desc" data-schematic="true">
<title id="title">Projected area becomes solid angle; a sample is a cone</title>
<desc id="desc">A 2D side view maps a small patch at y to a projected solid angle at x. A 3D view shows the same patch as a cone on the sphere. Area measure, solid-angle measure, and the two cosine factors stay distinct. Schematic; one patch and one direction, not captured geometry.</desc>
<defs>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#286c56"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#286788"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#93661e"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#aa5343"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#586760"/></marker>
<marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22312d"/></marker>
</defs>
<rect width="1100" height="760" fill="#fffdf8"/>
<g font-family="Segoe UI, Arial, sans-serif">
<rect x="36" y="2" width="252" height="22" rx="4" fill="#f0f1e9" stroke="#93661e" stroke-width="1.5" opacity="1"/>
<text x="46" y="18" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#93661e" font-weight="600" text-anchor="start">SCHEMATIC · NOT CAPTURED GEOMETRY</text>
<text x="36" y="54" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#22312d" font-weight="600" text-anchor="start">Projected area becomes solid angle; a sample is a cone</text>
<text x="36" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#586760" font-weight="400" text-anchor="start">One patch, two measures: area dA and projected solid angle dσ. The cosines belong to different endpoints.</text>
<rect x="36" y="104" width="500" height="404" rx="8" fill="#f8f8f2" stroke="#c4cec7" stroke-width="1.5" opacity="1"/>
<path d="M46 105H526" stroke="#286c56" stroke-width="4"/>
<text x="52" y="134" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#286c56" font-weight="600" text-anchor="start">2D side view · one differential patch</text>
<rect x="560" y="104" width="504" height="404" rx="8" fill="#f8f8f2" stroke="#c4cec7" stroke-width="1.5" opacity="1"/>
<path d="M570 105H1054" stroke="#286788" stroke-width="4"/>
<text x="576" y="134" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#286788" font-weight="600" text-anchor="start">3D view · the same patch is a cone on the sphere</text>
<path d="M74 448L500 448" fill="none" stroke="#22312d" stroke-width="3"/>
<path d="M280 448L280 322" fill="none" stroke="#22312d" stroke-width="2" marker-end="url(#arrow-ink)"/>
<text x="288" y="316" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#22312d" font-weight="600" text-anchor="start">n_x</text>
<path d="M352 274L436 312" fill="none" stroke="#93661e" stroke-width="7"/>
<path d="M392 286L344 236" fill="none" stroke="#93661e" stroke-width="2" marker-end="url(#arrow-gold)"/>
<text x="330" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#93661e" font-weight="600" text-anchor="start">n_y</text>
<circle cx="392" cy="286" r="5" fill="#93661e" stroke="#93661e" stroke-width="1.5"/>
<text x="402" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#93661e" font-weight="600" text-anchor="start">y</text>
<path d="M280 448L392 286" fill="none" stroke="#286c56" stroke-width="3" marker-end="url(#arrow-green)"/>
<text x="314" y="362" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#286c56" font-weight="600" text-anchor="start">r</text>
<path d="M300 366L372 344" fill="none" stroke="#286c56" stroke-width="1" stroke-dasharray="8 6"/>
<path d="M280 448L352 274L436 312Z" fill="#93661e" stroke="#93661e" stroke-width="1" opacity="0.12"/>
<path d="M356 276L428 306" fill="none" stroke="#93661e" stroke-width="2" stroke-dasharray="8 6"/>
<path d="M280.00 410.00A38 38 0 0 1 302.87 417.65" fill="none" stroke="#93661e" stroke-width="2"/>
<text x="298" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#93661e" font-weight="600" text-anchor="start">θ_x</text>
<path d="M372.02 313.51A34 34 0 0 1 362.26 302.48" fill="none" stroke="#93661e" stroke-width="2"/>
<text x="368" y="276" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#93661e" font-weight="600" text-anchor="start">θ_y</text>
<text x="70" y="494" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#586760" font-weight="400" text-anchor="start">dA(y) is the target area; the cone it subtends is dσ at x.</text>
<rect x="70" y="150" width="270" height="34" rx="5" fill="#f0f1e9" stroke="#c4cec7" stroke-width="1" opacity="1"/>
<text x="82" y="174" font-family="Cascadia Code, Consolas, monospace" font-size="14" fill="#22312d" font-weight="400" text-anchor="start">dσ = |n_y · (−ω)| dA / r²</text>
<rect x="70" y="186" width="270" height="34" rx="5" fill="#f0f1e9" stroke="#c4cec7" stroke-width="1" opacity="1"/>
<text x="82" y="210" font-family="Cascadia Code, Consolas, monospace" font-size="14" fill="#22312d" font-weight="400" text-anchor="start">dσ_x⊥ = |n_x · ω| dσ</text>
<path d="M392 286L448 328" fill="none" stroke="#586760" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="404" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#586760" font-weight="400" text-anchor="start">|n_y · (−ω)| dA</text>
<ellipse cx="812" cy="310" rx="118" ry="82" fill="#fffdf8" stroke="#c4cec7" stroke-width="2"/>
<path d="M694 310A118 82 0 0 1 930 310" fill="#f0f1e9" stroke="#c4cec7" stroke-width="1.5"/>
<ellipse cx="812" cy="310" rx="118" ry="34" fill="none" stroke="#c4cec7" stroke-width="1.2" stroke-dasharray="8 6"/>
<ellipse cx="812" cy="310" rx="60" ry="82" fill="none" stroke="#c4cec7" stroke-width="1.2" stroke-dasharray="8 6"/>
<path d="M812 310L812 204" fill="none" stroke="#22312d" stroke-width="2" marker-end="url(#arrow-ink)"/>
<text x="820" y="198" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#22312d" font-weight="600" text-anchor="start">n_x</text>
<circle cx="812" cy="310" r="4" fill="#22312d" stroke="#22312d" stroke-width="1.5"/>
<text x="802" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#22312d" font-weight="600" text-anchor="start">x</text>
<path d="M812 310L886 242L925 262L900 286Z" fill="#93661e" stroke="#93661e" stroke-width="1" opacity="0.12"/>
<path d="M812 310L886 242" fill="none" stroke="#93661e" stroke-width="1.6" stroke-dasharray="8 6"/>
<path d="M812 310L925 262" fill="none" stroke="#93661e" stroke-width="1.6" stroke-dasharray="8 6"/>
<path d="M812 310L900 286" fill="none" stroke="#93661e" stroke-width="1.6" stroke-dasharray="8 6"/>
<path d="M886 242L925 262L900 286Z" fill="#93661e" stroke="#93661e" stroke-width="2" opacity="0.25"/>
<text x="915" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#93661e" font-weight="600" text-anchor="start">solid-angle cell dσ</text>
<path d="M760 250L800 270L778 294Z" fill="#286788" stroke="#286788" stroke-width="1.5" opacity="0.16"/>
<text x="706" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#286788" font-weight="400" text-anchor="start">same dA, larger r → smaller dσ</text>
<path d="M812 310L760 250" fill="none" stroke="#286788" stroke-width="1.5" stroke-dasharray="8 6"/>
<path d="M812 310L778 294" fill="none" stroke="#286788" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="640" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#586760" font-weight="400" text-anchor="start">The cone is a set of directions, not a surface point.</text>
<rect x="640" y="441" width="390" height="34" rx="5" fill="#f0f1e9" stroke="#c4cec7" stroke-width="1" opacity="1"/>
<text x="652" y="465" font-family="Cascadia Code, Consolas, monospace" font-size="14" fill="#22312d" font-weight="400" text-anchor="start">projected solid angle weights by |n_x · ω|</text>
<rect x="36" y="532" width="320" height="152" rx="8" fill="#f8f8f2" stroke="#c4cec7" stroke-width="1.5" opacity="1"/>
<text x="52" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#286c56" font-weight="600" text-anchor="start">Area measure</text>
<text x="52" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#22312d" font-weight="400" text-anchor="start">dA(y) at the target</text>
<text x="52" y="614" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#22312d" font-weight="400" text-anchor="start">used by the area-product path density</text>
<text x="52" y="638" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#22312d" font-weight="400" text-anchor="start">contains no cosine by itself</text>
<rect x="390" y="532" width="320" height="152" rx="8" fill="#f8f8f2" stroke="#c4cec7" stroke-width="1.5" opacity="1"/>
<text x="406" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#286c56" font-weight="600" text-anchor="start">Solid-angle measure</text>
<text x="406" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#22312d" font-weight="400" text-anchor="start">dσ around ω at x</text>
<text x="406" y="614" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#22312d" font-weight="400" text-anchor="start">sampler density p_σ(ω)</text>
<text x="406" y="638" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#22312d" font-weight="400" text-anchor="start">the estimator divides by p_σ</text>
<rect x="744" y="532" width="320" height="152" rx="8" fill="#f8f8f2" stroke="#c4cec7" stroke-width="1.5" opacity="1"/>
<text x="760" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#286c56" font-weight="600" text-anchor="start">Why 1/r² cancels</text>
<text x="760" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#22312d" font-weight="400" text-anchor="start">p_A(y|x) = p_σ(ω)|n_y·(−ω)|/r²</text>
<text x="760" y="614" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#22312d" font-weight="400" text-anchor="start">G contains the same 1/r²</text>
<text x="760" y="638" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#22312d" font-weight="400" text-anchor="start">f/p leaves one receiving cosine</text>
<path d="M36 716L1064 716" fill="none" stroke="#c4cec7" stroke-width="1"/>
<text x="36" y="740" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#586760" font-weight="400" text-anchor="start">Schematic. One patch, one direction. The matched Lumen/path-traced pair is a convergence comparison, not a sample dump.</text>
</g></svg>
