<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" width="1100" height="760" role="img" aria-labelledby="title desc" data-schematic="true">
<title id="title">One visible point, two lighting owners</title>
<desc id="desc">A deferred G-buffer supplies the primary surface; direct lights evaluate one path family and Lumen cached lighting supplies another. A 3D view separates direct light at x from light bounced through a secondary point y. Schematic; not a captured G-buffer or a measured pass cost.</desc>
<defs>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#286c56"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#286788"/></marker>
<marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#93661e"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#aa5343"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#586760"/></marker>
<marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22312d"/></marker>
</defs>
<rect width="1100" height="760" fill="#fffdf8"/>
<g font-family="Segoe UI, Arial, sans-serif">
<rect x="36" y="2" width="252" height="22" rx="4" fill="#f0f1e9" stroke="#93661e" stroke-width="1.5" opacity="1"/>
<text x="46" y="18" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#93661e" font-weight="600" text-anchor="start">SCHEMATIC · NOT CAPTURED GEOMETRY</text>
<text x="36" y="54" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#22312d" font-weight="600" text-anchor="start">One visible point, two lighting owners</text>
<text x="36" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#586760" font-weight="400" text-anchor="start">Direct light at x and cached indirect light through y are different path families, not duplicate terms.</text>
<rect x="36" y="104" width="520" height="424" rx="8" fill="#f8f8f2" stroke="#c4cec7" stroke-width="1.5" opacity="1"/>
<path d="M46 105H546" stroke="#286c56" stroke-width="4"/>
<text x="52" y="134" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#286c56" font-weight="600" text-anchor="start">2D · primary G-buffer and two owners</text>
<rect x="66" y="158" width="262" height="52" rx="5" fill="#fffdf8" stroke="#286c56" stroke-width="1.5" opacity="1"/>
<text x="80" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#286c56" font-weight="600" text-anchor="start">depth</text>
<text x="80" y="198" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#586760" font-weight="400" text-anchor="start">primary geometric x</text>
<rect x="66" y="220" width="262" height="52" rx="5" fill="#fffdf8" stroke="#286788" stroke-width="1.5" opacity="1"/>
<text x="80" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#286788" font-weight="600" text-anchor="start">normal</text>
<text x="80" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#586760" font-weight="400" text-anchor="start">n_g, n_s</text>
<rect x="66" y="282" width="262" height="52" rx="5" fill="#fffdf8" stroke="#93661e" stroke-width="1.5" opacity="1"/>
<text x="80" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#93661e" font-weight="600" text-anchor="start">base color</text>
<text x="80" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#586760" font-weight="400" text-anchor="start">ρ_d</text>
<rect x="66" y="344" width="262" height="52" rx="5" fill="#fffdf8" stroke="#aa5343" stroke-width="1.5" opacity="1"/>
<text x="80" y="366" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#aa5343" font-weight="600" text-anchor="start">metallic / roughness / specular</text>
<text x="80" y="384" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#586760" font-weight="400" text-anchor="start">f_s parameters</text>
<path d="M328 250L378 220" fill="none" stroke="#286788" stroke-width="2" marker-end="url(#arrow-blue)"/>
<path d="M328 250L378 300" fill="none" stroke="#93661e" stroke-width="2" marker-end="url(#arrow-gold)"/>
<text x="384" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#286788" font-weight="600" text-anchor="start">deferred direct</text>
<text x="384" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#586760" font-weight="400" text-anchor="start">V(x↔light)</text>
<text x="384" y="316" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#93661e" font-weight="600" text-anchor="start">Lumen indirect</text>
<text x="384" y="334" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#586760" font-weight="400" text-anchor="start">cached secondary</text>
<rect x="66" y="430" width="466" height="30" rx="5" fill="#f0f1e9" stroke="#c4cec7" stroke-width="1" opacity="1"/>
<text x="78" y="454" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#22312d" font-weight="400" text-anchor="start">L_o(x) = L_e + (ρ/π)(E_direct(x) + E_indirect(x))</text>
<rect x="66" y="466" width="466" height="30" rx="5" fill="#f0f1e9" stroke="#c4cec7" stroke-width="1" opacity="1"/>
<text x="78" y="490" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#22312d" font-weight="400" text-anchor="start">E_indirect(x) = ∫ (ρ(y)/π) E_direct(y) G dA(y)</text>
<text x="66" y="504" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#aa5343" font-weight="400" text-anchor="start">Different path families: do not subtract cached direct at y</text>
<text x="66" y="520" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#aa5343" font-weight="400" text-anchor="start">as if it duplicated the direct pass at x.</text>
<rect x="580" y="104" width="484" height="424" rx="8" fill="#f8f8f2" stroke="#c4cec7" stroke-width="1.5" opacity="1"/>
<path d="M590 105H1054" stroke="#286788" stroke-width="4"/>
<text x="596" y="134" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#286788" font-weight="600" text-anchor="start">3D · direct at x versus indirect through y</text>
<path d="M640 430L940 470L1010 400L700 360Z" fill="#f0f1e9" stroke="#c4cec7" stroke-width="1" opacity="1"/>
<path d="M700 360L1010 400L1010 190L700 150Z" fill="#edf3ee" stroke="#c4cec7" stroke-width="1" opacity="0.6"/>
<text x="720" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#586760" font-weight="400" text-anchor="start">secondary wall</text>
<circle cx="860" cy="360" r="7" fill="#aa5343" stroke="#aa5343" stroke-width="1.5"/>
<text x="872" y="382" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#aa5343" font-weight="600" text-anchor="start">x</text>
<circle cx="770" cy="300" r="6" fill="#93661e" stroke="#93661e" stroke-width="1.5"/>
<text x="746" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#93661e" font-weight="600" text-anchor="start">y</text>
<circle cx="900" cy="148" r="8" fill="#93661e" stroke="#93661e" stroke-width="1.5"/>
<text x="914" y="152" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#93661e" font-weight="600" text-anchor="start">L</text>
<path d="M898 158L872 340" fill="none" stroke="#286788" stroke-width="3" marker-end="url(#arrow-blue)"/>
<text x="900" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#286788" font-weight="600" text-anchor="start">direct path</text>
<text x="900" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#586760" font-weight="400" text-anchor="start">V, shadow map</text>
<path d="M898 158L780 286L850 352" fill="none" stroke="#93661e" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-gold)"/>
<text x="712" y="246" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#93661e" font-weight="600" text-anchor="start">indirect path</text>
<text x="712" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#586760" font-weight="400" text-anchor="start">L → y → x</text>
<text x="636" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#586760" font-weight="400" text-anchor="start">G(x↔y) includes both cosines and 1/r².</text>
<text x="636" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#586760" font-weight="400" text-anchor="start">The tracer supplies an approximate visibility.</text>
<rect x="36" y="552" width="1028" height="152" rx="8" fill="#f0f1e9" stroke="#c4cec7" stroke-width="1.5" opacity="1"/>
<text x="54" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#286c56" font-weight="600" text-anchor="start">The GBuffer triplet is an input, not the lighting result</text>
<rect x="66" y="600" width="142" height="24" rx="4" fill="#fffdf8" stroke="#aa5343" stroke-width="1.2" opacity="1"/>
<text x="75" y="614" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#aa5343" font-weight="600" text-anchor="start">metallic</text>
<text x="66" y="646" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#22312d" font-weight="400" text-anchor="start">selects F0 / metal workflow</text>
<rect x="396" y="600" width="142" height="24" rx="4" fill="#fffdf8" stroke="#aa5343" stroke-width="1.2" opacity="1"/>
<text x="405" y="614" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#aa5343" font-weight="600" text-anchor="start">roughness</text>
<text x="396" y="646" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#22312d" font-weight="400" text-anchor="start">shapes the specular lobe width</text>
<rect x="726" y="600" width="142" height="24" rx="4" fill="#fffdf8" stroke="#aa5343" stroke-width="1.2" opacity="1"/>
<text x="735" y="614" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#aa5343" font-weight="600" text-anchor="start">specular</text>
<text x="726" y="646" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#22312d" font-weight="400" text-anchor="start">F0 for the legacy default-lit path</text>
<text x="54" y="686" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#586760" font-weight="400" text-anchor="start">Inspect the captured metallic, roughness and specular channel views together; they parameterize f_s, while the lighting integral is evaluated later.</text>
<path d="M36 716L1064 716" fill="none" stroke="#c4cec7" stroke-width="1"/>
<text x="36" y="740" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#586760" font-weight="400" text-anchor="start">Schematic. The actual channel views and pass identities are in the captured GBuffer figures; this is not a captured G-buffer.</text>
</g></svg>
