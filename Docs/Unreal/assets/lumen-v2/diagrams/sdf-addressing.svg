<text x="35" y="570" font-size="22" fill="#286c56" font-weight="600" text-anchor="start">Page-table z slices: source-default example R = 252, P = 36</text>
<rect x="35" y="600" width="530" height="48" rx="8" fill="#edf3ee" stroke="#286788" stroke-width="1.5"/>
<text x="52" y="631" font-size="20" fill="#286788" font-weight="400" text-anchor="start">Clipmap 0:  z = 0 … 35     (local z + 0)</text>
<rect x="35" y="658" width="530" height="48" rx="8" fill="#edf3ee" stroke="#286c56" stroke-width="1.5"/>
<text x="52" y="689" font-size="20" fill="#286c56" font-weight="400" text-anchor="start">Clipmap 1:  z = 36 … 71     (local z + 36)</text>
<rect x="35" y="716" width="530" height="48" rx="8" fill="#edf3ee" stroke="#93661e" stroke-width="1.5"/>
<text x="52" y="747" font-size="20" fill="#93661e" font-weight="400" text-anchor="start">Clipmap 2:  z = 72 … 107     (local z + 72)</text>
