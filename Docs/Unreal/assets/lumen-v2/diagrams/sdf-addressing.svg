<text x="52" y="805" font-size="20" fill="#aa5343" font-weight="400" text-anchor="start">Clipmap 3:  z = 108 … 143     (local z + 108)</text>
<text x="35" y="880" font-size="20" fill="#22312d" font-weight="400" text-anchor="start">Leaving out iP samples another clipmap.</text>
<text x="35" y="909" font-size="20" fill="#22312d" font-weight="400" text-anchor="start">Packed object-grid value 0 is valid; 0xFFFFFFFF is invalid.</text>
