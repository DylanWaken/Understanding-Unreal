<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1002" viewBox="0 0 1280 1002" role="img" aria-label="Virtual Shadow Map projection: 16 packed mask nibbles">
<title>Virtual Shadow Map projection: 16 packed mask nibbles</title>
<desc>Captured buffer visualization. Virtual Shadow Map projection: 16 packed mask nibbles graph 0001 | VirtualShadowMapProjection pass | R32G32_UINT, 16 x 4-bit masks NIBBLE 0 NIBBLE 1 NIBBLE 2 NIBBLE 3 NIBBLE 4 NIBBLE 5 NIBBLE 6 NIBBLE 7 NIBBLE 8 NIBBLE 9 NIBBLE 10 NIBBLE 11 NIBBLE 12 NIBBLE 13 NIBBLE 14 NIBBLE 15 mask nibble 0 (black) .. 15 (white) Shadow.Virtual.MaskBits is PF_R32G32_UINT: 16 packed 4-bit mask values per pixel, one per light/grid slot. Nibble 0 is the low nibble of the first uint; nibble 8 is the low nibble of the second uint. The panels preserve all 16 fields; no combined mask is computed. The 4x4 sheet is a 4x downscale of the 1280x720 view rect. Nonzero nibbles in this capture: 0. The other nibbles are valid all-clear zero masks, not missing data.</desc>
