<title>Lumen screen probes: world normal per probe</title>
<desc>Captured buffer visualization. Lumen screen probes: world normal per probe graph 0001 | occupied probe crop x=8 y=0 w=63 h=49 | octahedral RG8 world normal N*0.5+0.5 invalid probe (depth &lt;= 0) Source: GetScreenProbeNormal = OctahedronToUnitVector(ScreenProbeWorldNormal * 2 - 1) (LumenScreenProbeCommon.ush:89-92; OctahedralCommon.ush:28-34). The stored RG8 is an octahedral direction, not two independent angles. Probes with non-positive scene depth are invalid and drawn magenta; their stale normal bytes are not decoded as a direction. The same occupied probe crop as the depth figure is used; unused bottom rows of the 80x84 atlas are omitted and recorded in display.source_crop_xywh.</desc>
