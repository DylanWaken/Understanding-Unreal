name: Deploy Understanding Unreal to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "Docs/**"
      - "Data/Sponza/**"
      - "Scripts/Docs/unreal_articles/**"
      - "Scripts/Docs/check_site_independence.py"
      - ".github/workflows/pages.yml"
      - "README.md"
      - "MIGRATION.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package the standalone site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up the evidence decoder runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install CPU evidence decoder dependencies
        run: python3 -m pip install -r Scripts/Docs/unreal_articles/labs/lumen-sponza/requirements.txt

      - name: Check generated essays
        run: python3 Scripts/Docs/unreal_articles/build.py --check

      - name: Check the offline equation cache
        run: python3 Scripts/Docs/unreal_articles/math_typesetting.py --check --node node

      - name: Validate reproducible laboratory evidence
        run: python3 Scripts/Docs/unreal_articles/validate_labs.py

      - name: Validate Lumen derivation and captured reference evidence
        run: python3 Scripts/Docs/unreal_articles/validate_lumen_v2.py

      - name: Verify explanatory diagrams and reference presentation
        run: python3 Scripts/Docs/unreal_articles/labs/lumen-reading/generate.py --check

      - name: Verify the forward-design teaching experiments
        run: |
          python3 Scripts/Docs/unreal_articles/labs/lumen-course/generate.py --check
          node --check Docs/Unreal/assets/lumen-course/course.js
          node --check Docs/Unreal/assets/lumen-course/temporal.js

      - name: Check frame decoders and actual package reads
        run: |
          python3 -m unittest discover -s Scripts/Docs/unreal_articles/labs/lumen-frame/tests -q
          python3 -m unittest discover -s Scripts/Docs/unreal_articles/labs/lumen-frame -p test_verify_frame_evidence.py -q
          node Scripts/Docs/unreal_articles/labs/lumen-frame/tests/test_metadata_browser.cjs
          node Scripts/Docs/unreal_articles/labs/lumen-frame/tests/test_codec.cjs
          node Scripts/Docs/unreal_articles/labs/lumen-frame/tests/test_read_path.cjs

      - name: Verify published Sponza evidence
        run: |
          python3 Scripts/Docs/unreal_articles/labs/lumen-sponza/verify_package_copy.py
          python3 -c "import shutil; [shutil.copytree('Docs/Unreal/assets/lumen-sponza/' + name, '/tmp/' + name) for name in ('receivers', 'context', 'vsm-storage')]"
          python3 Scripts/Docs/unreal_articles/labs/lumen-sponza/decode_receivers.py --out /tmp/receivers --stage verify
          python3 Scripts/Docs/unreal_articles/labs/lumen-sponza/cache-replay/verify_queries.py
          python3 Scripts/Docs/unreal_articles/labs/lumen-sponza/decode_context.py --out /tmp/context --stage verify
          python3 Scripts/Docs/unreal_articles/labs/lumen-sponza/decode_vsm_storage.py --out /tmp/vsm-storage --verify
          python3 Scripts/Docs/unreal_articles/labs/lumen-sponza/build_temporal_manifest.py --check
          python3 Scripts/Docs/unreal_articles/labs/lumen-sponza/archive_temporal.py verify --package Data/Sponza/temporal-native/package --out /tmp/temporal-native-verification.json

      - name: Validate essays, links and figures
        run: python3 Scripts/Docs/unreal_articles/validate.py

      - name: Check standalone site independence
        run: python3 Scripts/Docs/check_site_independence.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: Docs
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
