<title>GBufferB: Metallic (shader .r, memory byte 2)</title>
<desc>Captured buffer visualization. GBufferB: Metallic (shader .r, memory byte 2) graph 0001 | BasePassParallel pass | valid only where GBufferB.A != 0 valid 0.0 (black) .. 1.0 (white) no geometry (A == 0) Source: DeferredShadingCommon.ush:1007-1009 writes Metallic, Specular, Roughness to B.r/B.g/B.b; PF_B8G8R8A8 memory order is B,G,R,A. The three fields are decoded independently; no combined colour is used for this quantity. Black is a valid zero value; navy marks background/cleared pixels where A == 0.</desc>
