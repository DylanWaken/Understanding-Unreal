<svg xmlns="http://www.w3.org/2000/svg" width="784" height="960" viewBox="0 0 784 960" role="img" aria-label="World radiance cache: representative indirection slices">
<title>World radiance cache: representative indirection slices</title>
<desc>Captured buffer visualization. World radiance cache: representative indirection slices graph 0001 | Texture3D 192x48x48 | occupied slices [22, 24, 26] Z SLICE 22 / 47 | crop x=19 y=26 w=11 h=10 | magenta = invalid 0xFFFFFFFF Z SLICE 24 / 47 | crop x=19 y=26 w=11 h=10 | magenta = invalid 0xFFFFFFFF Z SLICE 26 / 47 | crop x=19 y=26 w=11 h=10 | magenta = invalid 0xFFFFFFFF valid probe index (categorical low 16 bits) invalid page (0xFFFFFFFF) valid zero word Source: LumenRadianceCacheInterpolation.ush:302-317 defines EncodeProbeIndirection/DecodeProbeIndirection: 0xFFFFFFFF = invalid; low 16 bits = probe index; bits 16..18 = NumAdaptiveProbes. This is the world-cache indirection volume read by TraceGlobalSDFAndApplyRadianceCache. The first, middle and last occupied z slices use a shared crop around their occupied probes. Invalid is a categorical magenta page, never radiance=0. A valid zero probe index is a different colour; no page is resampled or interpolated.</desc>
