<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="562" viewBox="0 0 1280 562" role="img" aria-label="Virtual Shadow Map: page table state">
<title>Virtual Shadow Map: page table state</title>
<desc>Captured buffer visualization. Virtual Shadow Map: page table state graph 0001 | PropagateMappedMips version | PF_R32_UINT 8192x192 FULL PAGE TABLE 8192x192 (x-downsampled) | invalid=0 | mapped LOD0=green | coarser=blue | renderable=orange | secondary=magenta | dummy=white NATIVE 1280x192 WINDOW at x=128 (densest region) invalid (0) mapped at this LOD mapped coarser LOD valid for rendering secondary request dummy 0xFFFFFFFF Source: ShadowDecodePageTable / ShadowEncodePageTable (VirtualShadowMapPageAccessCommon.ush:247-286): bits 0..9 = physical X, 10..19 = physical Y, 20..25 = LODOffset, bit29 = secondary, bit30 = valid-for-rendering, bit31 = any LOD valid; 0 = invalid; VirtualShadowMapArray.cpp:985 records 0xFFFFFFFF as the dummy page. The full 8192x192 table is compressed horizontally in the overview; the lower panel is a native 1280x192 window at the densest x offset, so page-state pixels are not resampled there. This is page state, not VSM depth/radiance. Renderer debug screenshots from the baseline run are not used or relabelled.</desc>
