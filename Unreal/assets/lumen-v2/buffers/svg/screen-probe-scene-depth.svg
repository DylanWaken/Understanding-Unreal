<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="656" height="798" viewBox="0 0 656 798" role="img" aria-label="Lumen screen probes: scene depth per probe">
<title>Lumen screen probes: scene depth per probe</title>
<desc>Captured buffer visualization. Lumen screen probes: scene depth per probe graph 0001 | occupied probe crop x=8 y=0 w=63 h=49 | asfloat(uint) depth probe scene depth (log10, cm): near=blue -&gt; far=red invalid probe (depth &lt;= 0 or non-finite) Source: ScreenProbeSceneDepth is Texture2D&lt;uint&gt;, read as asfloat (LumenScreenProbeCommon.ush:78-86). Negative depth means an invalid/unlit probe; those are magenta, not depth 0. The texture is 80x84 probe entries (the probe atlas), not a 1280x720 screen image. The crop covers the occupied probe rows/columns (8..70, 0..48); unused bottom rows are omitted and recorded here. Depth is linear world-space depth in Unreal units (cm). The occupied crop is scaled to 640 px wide with nearest-neighbour sampling.</desc>
<rect width="100%" height="100%" fill="#0A0A0A"/>
