<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Partition contributions before assigning passes</title><desc id="desc">The exact source and lobe partition has emission, selected analytical direct illumination, remaining diffuse, and remaining glossy terms. Lumen may include sky and emissive source connections, not only multibounce paths.</desc>
<defs><marker id="arrow-0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#286c56"/></marker><marker id="arrow-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#286788"/></marker><marker id="arrow-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#93661e"/></marker><marker id="arrow-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#aa5343"/></marker><marker id="arrow-4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#586760"/></marker></defs>
<rect width="1200" height="690" fill="#fffdf8"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="36" y="48" font-size="30" fill="#22312d" font-weight="600" text-anchor="start">Partition contributions before assigning passes</text>
<rect x="390" y="90" width="420" height="92" rx="8" fill="#fffdf8" stroke="#286c56" stroke-width="1.5"/>
<path d="M402 91H798" stroke="#286c56" stroke-width="4"/>
<text x="408" y="125" font-size="23" fill="#286c56" font-weight="600" text-anchor="start">Outgoing radiance toward camera</text>
<text x="408" y="159" font-size="19" fill="#22312d" font-weight="400" text-anchor="start">Lₒ = emission + direct + remaining</text>
<rect x="28" y="270" width="272" height="195" rx="8" fill="#fffdf8" stroke="#286c56" stroke-width="1.5"/>
<path d="M40 271H288" stroke="#286c56" stroke-width="4"/>
<text x="46" y="305" font-size="23" fill="#286c56" font-weight="600" text-anchor="start">Emission</text>
<text x="46" y="339" font-size="19" fill="#22312d" font-weight="400" text-anchor="start">Lₑ</text>
<text x="46" y="367" font-size="19" fill="#22312d" font-weight="400" text-anchor="start">Visible emitting material</text>
<text x="46" y="395" font-size="19" fill="#22312d" font-weight="400" text-anchor="start">Base-pass contribution</text>
<path d="M164 260L600 196" fill="none" stroke="#286c56" stroke-width="2" marker-end="url(#arrow-0)"/>
<rect x="324" y="270" width="272" height="195" rx="8" fill="#fffdf8" stroke="#286788" stroke-width="1.5"/>
<path d="M336 271H584" stroke="#286788" stroke-width="4"/>
<text x="342" y="305" font-size="23" fill="#286788" font-weight="600" text-anchor="start">Analytical direct</text>
<text x="342" y="339" font-size="19" fill="#22312d" font-weight="400" text-anchor="start">∫ (f_d + f_g) Lᵢ,ᴬ dσ⊥</text>
<text x="342" y="367" font-size="19" fill="#22312d" font-weight="400" text-anchor="start">Selected local light set</text>
<text x="342" y="395" font-size="19" fill="#22312d" font-weight="400" text-anchor="start">Deferred lights + visibility</text>
<path d="M460 260L600 196" fill="none" stroke="#286788" stroke-width="2" marker-end="url(#arrow-1)"/>
<rect x="620" y="270" width="272" height="195" rx="8" fill="#fffdf8" stroke="#93661e" stroke-width="1.5"/>
<path d="M632 271H880" stroke="#93661e" stroke-width="4"/>
<text x="638" y="305" font-size="23" fill="#93661e" font-weight="600" text-anchor="start">Remaining diffuse</text>
<text x="638" y="339" font-size="19" fill="#22312d" font-weight="400" text-anchor="start">∫ f_d Lᵢ,ᴿ dσ⊥</text>
<text x="638" y="367" font-size="19" fill="#22312d" font-weight="400" text-anchor="start">Sky, emitters, reflected light</text>
<text x="638" y="395" font-size="19" fill="#22312d" font-weight="400" text-anchor="start">Probe gathering + material</text>
<path d="M756 260L600 196" fill="none" stroke="#93661e" stroke-width="2" marker-end="url(#arrow-2)"/>
<rect x="916" y="270" width="272" height="195" rx="8" fill="#fffdf8" stroke="#aa5343" stroke-width="1.5"/>
<path d="M928 271H1176" stroke="#aa5343" stroke-width="4"/>
<text x="934" y="305" font-size="23" fill="#aa5343" font-weight="600" text-anchor="start">Remaining glossy</text>
<text x="934" y="339" font-size="19" fill="#22312d" font-weight="400" text-anchor="start">∫ f_g Lᵢ,ᴿ dσ⊥</text>
<text x="934" y="367" font-size="19" fill="#22312d" font-weight="400" text-anchor="start">Same remaining source field</text>
<text x="934" y="395" font-size="19" fill="#22312d" font-weight="400" text-anchor="start">Rough/dedicated reflections</text>
<path d="M1052 260L600 196" fill="none" stroke="#aa5343" stroke-width="2" marker-end="url(#arrow-3)"/>
<rect x="55" y="515" width="1090" height="105" rx="8" fill="#edf3ee" stroke="#c4cec7" stroke-width="1.5"/>
<text x="80" y="552" font-size="23" fill="#286c56" font-weight="600" text-anchor="start">A light → wall → receiver path is different from a light → receiver path.</text>
<text x="80" y="589" font-size="19" fill="#22312d" font-weight="400" text-anchor="start">Keep secondary cached direct light. Blend overlapping glossy representations instead of adding them.</text>
<text x="36" y="666" font-size="16" fill="#586760" font-weight="400" text-anchor="start">Original explanatory diagram; positions and colors are schematic.</text>
</g></svg>
