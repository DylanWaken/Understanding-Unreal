<text x="40" y="49" font-size="28" fill="#eef4ff" text-anchor="start">Follow one hit all the way to its texel</text>
<text x="40" y="588" font-size="16" fill="#a7b9d3" text-anchor="start">SCHEMATIC</text>
<text x="61" y="159" font-size="23" fill="#6ce1b5" text-anchor="start">world hit</text>
<text x="61" y="193" font-size="19" fill="#a7b9d3" text-anchor="start">position + normal</text>
<text x="61" y="222" font-size="19" fill="#a7b9d3" text-anchor="start">mesh / card identity</text>
<text x="351" y="159" font-size="23" fill="#65baff" text-anchor="start">card coordinates</text>
<text x="351" y="193" font-size="19" fill="#a7b9d3" text-anchor="start">UV + capture depth</text>
<text x="351" y="222" font-size="19" fill="#a7b9d3" text-anchor="start">mip + virtual texel</text>
<text x="641" y="159" font-size="23" fill="#c4a0ff" text-anchor="start">page entry</text>
<text x="641" y="193" font-size="19" fill="#a7b9d3" text-anchor="start">resident + valid</text>
<text x="641" y="222" font-size="19" fill="#a7b9d3" text-anchor="start">physical rectangle</text>
<text x="90" y="515" font-size="23" fill="#65baff" text-anchor="start">logical page</text>
<text x="580" y="515" font-size="23" fill="#ffd36f" text-anchor="start">physical taps + border + depth validity</text>
