<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">A budget encourages reuse at specific boundaries</title><desc id="desc">Independent paths are reorganized to share secondary surface shading, receiver integration, and valid time history.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1200" height="620" rx="12" fill="#101b2d"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif">
<circle cx="90" cy="160" r="9" stroke="#65baff" stroke-width="2" fill="#65baff"/>
<path d="M105 160L350 245" stroke="#ffd36f" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<circle cx="90" cy="250" r="9" stroke="#65baff" stroke-width="2" fill="#65baff"/>
<path d="M105 250L350 245" stroke="#ffd36f" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<circle cx="90" cy="340" r="9" stroke="#65baff" stroke-width="2" fill="#65baff"/>
<path d="M105 340L350 245" stroke="#ffd36f" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="365" y="165" width="240" height="170" rx="5" stroke="#ffd36f" stroke-width="2" fill="#18283e"/>
<path d="M610 245L675 245" stroke="#eef4ff" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="690" y="165" width="205" height="170" rx="5" stroke="#6ce1b5" stroke-width="2" fill="#18283e"/>
<path d="M900 245L965 245" stroke="#eef4ff" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="980" y="165" width="170" height="170" rx="5" stroke="#c4a0ff" stroke-width="2" fill="#18283e"/>
<text x="40" y="49" font-size="28" fill="#eef4ff" text-anchor="start">A budget encourages reuse at specific boundaries</text>
<text x="40" y="588" font-size="16" fill="#a7b9d3" text-anchor="start">SCHEMATIC</text>
<text x="55" y="135" font-size="18" fill="#65baff" text-anchor="start">pixel 1</text>
<text x="55" y="225" font-size="18" fill="#65baff" text-anchor="start">pixel 2</text>
<text x="55" y="315" font-size="18" fill="#65baff" text-anchor="start">pixel 3</text>
<text x="381" y="199" font-size="23" fill="#ffd36f" text-anchor="start">Surface cache</text>
<text x="381" y="233" font-size="19" fill="#a7b9d3" text-anchor="start">one secondary</text>
<text x="381" y="262" font-size="19" fill="#a7b9d3" text-anchor="start">material + lighting</text>
<text x="381" y="291" font-size="19" fill="#a7b9d3" text-anchor="start">answer per location</text>
<text x="706" y="199" font-size="23" fill="#6ce1b5" text-anchor="start">Screen probes</text>
<text x="706" y="233" font-size="19" fill="#a7b9d3" text-anchor="start">share a sampled</text>
<text x="706" y="262" font-size="19" fill="#a7b9d3" text-anchor="start">incoming field</text>
<text x="996" y="199" font-size="23" fill="#c4a0ff" text-anchor="start">History</text>
<text x="996" y="233" font-size="19" fill="#a7b9d3" text-anchor="start">reuse valid</text>
<text x="996" y="262" font-size="19" fill="#a7b9d3" text-anchor="start">measurements</text>
<text x="80" y="435" font-size="25" fill="#eef4ff" text-anchor="start">The cost saved and the approximation introduced are different at each boundary.</text>
<text x="80" y="464" font-size="25" fill="#eef4ff" text-anchor="start">Never describe all three as “a cheaper ray.”</text>
</g></svg>
