<text x="40" y="49" font-size="28" fill="#eef4ff" text-anchor="start">Sampling density and estimator weight work together</text>
<text x="40" y="588" font-size="16" fill="#a7b9d3" text-anchor="start">SCHEMATIC</text>
<text x="310" y="115" font-size="26" fill="#eef4ff" text-anchor="middle">Uniform hemisphere</text>
<text x="310" y="470" font-size="26" fill="#65baff" text-anchor="middle">p = 1 / (2π)</text>
<text x="310" y="513" font-size="26" fill="#6ce1b5" text-anchor="middle">local weight = 2ρ cos θ</text>
<text x="870" y="115" font-size="26" fill="#eef4ff" text-anchor="middle">Cosine hemisphere</text>
<text x="870" y="470" font-size="26" fill="#65baff" text-anchor="middle">p = cos θ / π</text>
<text x="870" y="513" font-size="26" fill="#6ce1b5" text-anchor="middle">local weight = ρ</text>
</g></svg>
