<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">The hit density carries the same geometric falloff</title><desc id="desc">For a visible ray hit, geometry is starting cosine times target cosine over distance squared. The area PDF is the solid-angle PDF times target cosine over distance squared. Dividing cancels the target cosine and distance factor, leaving starting cosine divided by solid-angle PDF.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1200" height="620" rx="12" fill="#101b2d"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif">
<rect x="40" y="140" width="320" height="250" rx="8" stroke="#ffd36f" stroke-width="2" fill="#18283e"/>
<rect x="440" y="140" width="320" height="250" rx="8" stroke="#65baff" stroke-width="2" fill="#18283e"/>
<rect x="840" y="140" width="320" height="250" rx="8" stroke="#c4a0ff" stroke-width="2" fill="#18283e"/>
<rect x="195" y="200" width="140" height="60" rx="5" stroke="#6ce1b5" stroke-width="2" fill="#133c36"/>
<rect x="605" y="200" width="130" height="60" rx="5" stroke="#6ce1b5" stroke-width="2" fill="#133c36"/>
<path d="M370 265L428 265" stroke="#a7b9d3" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M770 265L828 265" stroke="#a7b9d3" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="40" y="49" font-size="28" fill="#eef4ff" text-anchor="start">The hit density carries the same geometric falloff</text>
<text x="40" y="588" font-size="16" fill="#a7b9d3" text-anchor="start">SCHEMATIC · geometry and colors explain a model; this is not an Unreal buffer</text>
<text x="40" y="99" font-size="22" fill="#a7b9d3" text-anchor="start">cₓ = cosine at the starting point     cᵧ = cosine at the hit     r = distance     V = 1</text>
<text x="58" y="180" font-size="21" fill="#ffd36f" text-anchor="start">Geometry in the integrand</text>
<text x="458" y="180" font-size="21" fill="#65baff" text-anchor="start">Density of the sampled hit</text>
<text x="858" y="180" font-size="21" fill="#c4a0ff" text-anchor="start">Ratio in the estimator</text>
<text x="65" y="236" font-size="28" fill="#ffd36f" text-anchor="start">G = cₓ ×</text>
<text x="265" y="239" font-size="28" fill="#6ce1b5" text-anchor="middle">cᵧ / r²</text>
<text x="65" y="305" font-size="22" fill="#eef4ff" text-anchor="start">Two projected areas,</text>
<text x="65" y="334" font-size="22" fill="#eef4ff" text-anchor="start">one inverse square.</text>
<text x="465" y="236" font-size="28" fill="#65baff" text-anchor="start">pₐ = pσ ×</text>
<text x="670" y="239" font-size="28" fill="#6ce1b5" text-anchor="middle">cᵧ / r²</text>
<text x="465" y="305" font-size="22" fill="#eef4ff" text-anchor="start">A direction density</text>
<text x="465" y="334" font-size="22" fill="#eef4ff" text-anchor="start">converted to area.</text>
<text x="865" y="239" font-size="28" fill="#c4a0ff" text-anchor="start">G / pₐ = cₓ / pσ</text>
<text x="865" y="305" font-size="22" fill="#eef4ff" text-anchor="start">The green factors</text>
<text x="865" y="334" font-size="22" fill="#eef4ff" text-anchor="start">cancel exactly.</text>
<text x="600" y="457" font-size="29" fill="#eef4ff" text-anchor="middle">Multiply by the BSDF:   βnew = βold × fₛ × cₓ / pσ</text>
<text x="600" y="514" font-size="22" fill="#a7b9d3" text-anchor="middle">A farther patch is hit less often. Its successful sample does not pay falloff twice.</text>
</g></svg>
