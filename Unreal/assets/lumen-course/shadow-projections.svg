<text x="40" y="49" font-size="28" fill="#eef4ff" text-anchor="start">Choose a shadow camera from the light</text>
<text x="40" y="588" font-size="16" fill="#a7b9d3" text-anchor="start">SCHEMATIC · geometry and colors explain a model; this is not an Unreal buffer</text>
<text x="60" y="115" font-size="24" fill="#ffd36f" text-anchor="start">Directional: parallel rays</text>
<text x="445" y="115" font-size="24" fill="#ffd36f" text-anchor="start">Spot: a perspective cone</text>
<text x="825" y="115" font-size="24" fill="#ffd36f" text-anchor="start">Point: six views</text>
<text x="65" y="470" font-size="22" fill="#65baff" text-anchor="start">Orthographic clipmaps</text>
<text x="65" y="502" font-size="19" fill="#a7b9d3" text-anchor="start">Nested coverage around the view</text>
<text x="640" y="244" font-size="18" fill="#65baff" text-anchor="start">near</text>
<text x="680" y="446" font-size="18" fill="#65baff" text-anchor="start">far</text>
<text x="450" y="470" font-size="22" fill="#65baff" text-anchor="start">Perspective projection</text>
<text x="450" y="502" font-size="19" fill="#a7b9d3" text-anchor="start">Outer cone bounds the field</text>
<text x="825" y="470" font-size="22" fill="#65baff" text-anchor="start">Directions ±X, ±Y, ±Z</text>
<text x="825" y="502" font-size="18" fill="#a7b9d3" text-anchor="start">One perspective face per direction</text>
