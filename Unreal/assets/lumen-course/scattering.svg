<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">One interaction adds contributions from many directions</title><desc id="desc">Incoming radiance is multiplied by the BSDF and incoming cosine, then integrated.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1200" height="620" rx="12" fill="#101b2d"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif">
<ellipse cx="420" cy="425" rx="280" ry="80" stroke="#65baff" stroke-width="2" fill="none"/>
<path d="M140 425 A280 280 0 0 1 700 425" stroke="#65baff" stroke-width="2" fill="none"/>
<path d="M671.917 360.675L420 425" stroke="#ffd36f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M634.587 278.193L420 425" stroke="#ffd36f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M560.479 206.218L420 425" stroke="#ffd36f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M438.392 165.651L420 425" stroke="#ffd36f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M311.802 188.583L420 425" stroke="#ffd36f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M197.209 290.97L420 425" stroke="#ffd36f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M420 425L600 260" stroke="#6ce1b5" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
<circle cx="420" cy="425" r="8" stroke="#eef4ff" stroke-width="2" fill="#eef4ff"/>
<rect x="790" y="155" width="355" height="270" rx="5" stroke="#ffd36f" stroke-width="2" fill="#18283e"/>
<text x="40" y="49" font-size="28" fill="#eef4ff" text-anchor="start">One interaction adds contributions from many directions</text>
<text x="40" y="588" font-size="16" fill="#a7b9d3" text-anchor="start">SCHEMATIC · geometry and colors explain a model; this is not an Unreal buffer</text>
<text x="130" y="545" font-size="21" fill="#eef4ff" text-anchor="start">Gold: incoming light · Green: outgoing toward camera</text>
<text x="806" y="189" font-size="23" fill="#ffd36f" text-anchor="start">At this point</text>
<text x="806" y="223" font-size="19" fill="#a7b9d3" text-anchor="start">1. read incoming radiance</text>
<text x="806" y="252" font-size="19" fill="#a7b9d3" text-anchor="start">2. evaluate material for</text>
<text x="806" y="281" font-size="19" fill="#a7b9d3" text-anchor="start">    this pair of directions</text>
<text x="806" y="310" font-size="19" fill="#a7b9d3" text-anchor="start">3. multiply incoming cosine</text>
<text x="806" y="339" font-size="19" fill="#a7b9d3" text-anchor="start">4. integrate and add emission</text>
</g></svg>
