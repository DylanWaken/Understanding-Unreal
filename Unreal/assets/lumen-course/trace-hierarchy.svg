<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">An unresolved screen ray is still a world-space question</title><desc id="desc">Screen depth contains only visible front surfaces; offscreen or hidden intersections need fallback tracing.</desc>
