<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Cards cache surface material and diffuse outgoing light</title><desc id="desc">Several secondary rays share one surface-lighting representation, addressed through oriented projections.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1200" height="620" rx="12" fill="#101b2d"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif">
<polygon points="130,220 400,140 400,440 130,510" stroke="#65baff" stroke-width="2" fill="#1d3851"/>
<polygon points="400,140 565,220 565,510 400,440" stroke="#a7b9d3" stroke-width="2" fill="#243148"/>
<polygon points="165,240 360,180 360,400 165,455" stroke="#6ce1b5" stroke-width="2" fill="none"/>
<path d="M60 170L260 320" stroke="#ffd36f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M60 310L260 320" stroke="#ffd36f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M60 470L260 320" stroke="#ffd36f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<circle cx="260" cy="320" r="7" stroke="#6ce1b5" stroke-width="2" fill="#6ce1b5"/>
<rect x="765" y="175" width="360" height="280" rx="5" stroke="#6ce1b5" stroke-width="2" fill="#18283e"/>
<text x="40" y="49" font-size="28" fill="#eef4ff" text-anchor="start">Cards cache surface material and diffuse outgoing light</text>
<text x="40" y="588" font-size="16" fill="#a7b9d3" text-anchor="start">SCHEMATIC · geometry and colors explain a model; this is not an Unreal buffer</text>
<text x="130" y="115" font-size="24" fill="#eef4ff" text-anchor="start">mesh + useful capture projections</text>
<text x="781" y="209" font-size="23" fill="#6ce1b5" text-anchor="start">A card is not a mirror</text>
<text x="781" y="243" font-size="19" fill="#a7b9d3" text-anchor="start">material: effective albedo</text>
<text x="781" y="272" font-size="19" fill="#a7b9d3" text-anchor="start">geometry: depth + normal</text>
<text x="781" y="301" font-size="19" fill="#a7b9d3" text-anchor="start">source: emissive radiance</text>
<text x="781" y="330" font-size="19" fill="#a7b9d3" text-anchor="start">lighting: direct + indirect</text>
<text x="781" y="359" font-size="19" fill="#a7b9d3" text-anchor="start">final: diffuse outgoing radiance</text>
</g></svg>
