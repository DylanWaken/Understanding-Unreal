<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Stored lighting propagates another scattering step</title><desc id="desc">Selected card updates reuse available final lighting while other pages retain prior values.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1200" height="620" rx="12" fill="#101b2d"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif">
<rect x="65" y="155" width="280" height="160" rx="5" stroke="#ffd36f" stroke-width="2" fill="#18283e"/>
<path d="M355 235L475 235" stroke="#ffd36f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<rect x="490" y="155" width="280" height="160" rx="5" stroke="#6ce1b5" stroke-width="2" fill="#18283e"/>
<path d="M785 235L890 235" stroke="#6ce1b5" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<rect x="905" y="155" width="230" height="160" rx="5" stroke="#65baff" stroke-width="2" fill="#18283e"/>
<path d="M1020 335 L1020 410 L190 410 L190 335" stroke="#c4a0ff" stroke-width="3" fill="none"/>
<path d="M190 380L190 325" stroke="#c4a0ff" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="40" y="49" font-size="28" fill="#eef4ff" text-anchor="start">Stored lighting propagates another scattering step</text>
<text x="40" y="588" font-size="16" fill="#a7b9d3" text-anchor="start">SCHEMATIC</text>
<text x="81" y="189" font-size="23" fill="#ffd36f" text-anchor="start">courtyard wall</text>
<text x="81" y="223" font-size="19" fill="#a7b9d3" text-anchor="start">fresh direct light</text>
<text x="81" y="252" font-size="19" fill="#a7b9d3" text-anchor="start">+ retained indirect</text>
<text x="81" y="281" font-size="19" fill="#a7b9d3" text-anchor="start">× wall albedo / π</text>
<text x="506" y="189" font-size="23" fill="#6ce1b5" text-anchor="start">arcade card gather</text>
<text x="506" y="223" font-size="19" fill="#a7b9d3" text-anchor="start">trace incident field</text>
<text x="506" y="252" font-size="19" fill="#a7b9d3" text-anchor="start">integrate irradiance</text>
<text x="506" y="281" font-size="19" fill="#a7b9d3" text-anchor="start">× arcade albedo / π</text>
<text x="921" y="189" font-size="23" fill="#65baff" text-anchor="start">next query</text>
<text x="921" y="223" font-size="19" fill="#a7b9d3" text-anchor="start">read the available</text>
<text x="921" y="252" font-size="19" fill="#a7b9d3" text-anchor="start">final-lighting atlas</text>
<text x="420" y="455" font-size="25" fill="#c4a0ff" text-anchor="start">persistent state and partial updates</text>
<text x="85" y="520" font-size="25" fill="#eef4ff" text-anchor="start">A frame updates only the selected tiles.</text>
</g></svg>
