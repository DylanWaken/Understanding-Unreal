<text x="40" y="49" font-size="28" fill="#eef4ff" text-anchor="start">Compose quantities with explicit owners</text>
<text x="40" y="588" font-size="16" fill="#a7b9d3" text-anchor="start">SCHEMATIC</text>
<text x="56" y="169" font-size="23" fill="#ffd36f" text-anchor="start">emission</text>
<text x="351" y="169" font-size="23" fill="#65baff" text-anchor="start">analytic direct</text>
<text x="646" y="169" font-size="23" fill="#6ce1b5" text-anchor="start">ρ_receiver × E / π</text>
<text x="941" y="169" font-size="23" fill="#c4a0ff" text-anchor="start">blended specular</text>
<text x="590" y="348" font-size="28" fill="#eef4ff" text-anchor="middle">+</text>
<text x="406" y="414" font-size="23" fill="#eef4ff" text-anchor="start">linear pre-exposed SceneColor</text>
<text x="926" y="414" font-size="23" fill="#ffd36f" text-anchor="start">display mapping</text>
<text x="90" y="530" font-size="24" fill="#eef4ff" text-anchor="start">Read each RGB buffer in the units its producer wrote.</text>
