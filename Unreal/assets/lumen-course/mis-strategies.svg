<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Different proposals, one measured integral</title><desc id="desc">A two-cell example: the target integral has cell contributions 0.8 and 0.2. Light sampling has probabilities 0.9 and 0.1; BSDF sampling 0.2 and 0.8; a half-and-half mixture 0.55 and 0.45. All rows sum to one, but the first row is the target, not a sampling distribution.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1200" height="620" rx="12" fill="#101b2d"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif">
<rect x="310" y="160" width="640.0" height="43" rx="0" stroke="#65baff" stroke-width="2" fill="#65baff"/>
<rect x="950.0" y="160" width="160.0" height="43" rx="0" stroke="#6ce1b5" stroke-width="2" fill="#6ce1b5"/>
<rect x="310" y="245" width="720.0" height="43" rx="0" stroke="#65baff" stroke-width="2" fill="#65baff"/>
<rect x="1030.0" y="245" width="80.0" height="43" rx="0" stroke="#6ce1b5" stroke-width="2" fill="#6ce1b5"/>
<rect x="310" y="330" width="160.0" height="43" rx="0" stroke="#65baff" stroke-width="2" fill="#65baff"/>
<rect x="470.0" y="330" width="640.0" height="43" rx="0" stroke="#6ce1b5" stroke-width="2" fill="#6ce1b5"/>
<rect x="310" y="415" width="440.00000000000006" height="43" rx="0" stroke="#65baff" stroke-width="2" fill="#65baff"/>
<rect x="750.0" y="415" width="360.0" height="43" rx="0" stroke="#6ce1b5" stroke-width="2" fill="#6ce1b5"/>
<text x="40" y="49" font-size="28" fill="#eef4ff" text-anchor="start">Different proposals, one measured integral</text>
<text x="40" y="588" font-size="16" fill="#a7b9d3" text-anchor="start">SCHEMATIC · geometry and colors explain a model; this is not an Unreal buffer</text>
<text x="40" y="105" font-size="22" fill="#a7b9d3" text-anchor="start">Blue: cell 1     Green: cell 2     Target contributions and probabilities are distinct.</text>
<text x="40" y="188" font-size="23" fill="#eef4ff" text-anchor="start">Target contribution</text>
<text x="630" y="189" font-size="23" fill="#101b2d" text-anchor="middle">0.8</text>
<text x="1030" y="189" font-size="23" fill="#101b2d" text-anchor="middle">0.2</text>
<text x="40" y="273" font-size="23" fill="#eef4ff" text-anchor="start">Light probability</text>
<text x="670" y="274" font-size="23" fill="#101b2d" text-anchor="middle">0.9</text>
<text x="1070" y="274" font-size="23" fill="#101b2d" text-anchor="middle">0.1</text>
<text x="40" y="358" font-size="23" fill="#eef4ff" text-anchor="start">BSDF probability</text>
<text x="390" y="359" font-size="23" fill="#101b2d" text-anchor="middle">0.2</text>
<text x="790" y="359" font-size="23" fill="#101b2d" text-anchor="middle">0.8</text>
<text x="40" y="443" font-size="23" fill="#eef4ff" text-anchor="start">50/50 mixture</text>
<text x="530" y="444" font-size="23" fill="#101b2d" text-anchor="middle">0.55</text>
<text x="930" y="444" font-size="23" fill="#101b2d" text-anchor="middle">0.45</text>
<text x="600" y="522" font-size="23" fill="#eef4ff" text-anchor="middle">A sampled cell returns its contribution divided by its sampling probability.</text>
</g></svg>
