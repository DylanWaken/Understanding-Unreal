<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Distance fields turn empty space into safe steps</title><desc id="desc">Ideal distance bounds allow sphere tracing; finite resolution requires conservative error handling.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<rect width="1200" height="620" rx="12" fill="#101b2d"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif">
<path d="M100 240L700 240" stroke="#65baff" stroke-width="5" fill="none"/>
<path d="M960 180L960 470" stroke="#65baff" stroke-width="5" fill="none"/>
<circle cx="210" cy="350" r="110" stroke="#6ce1b5" stroke-width="2" fill="none"/>
<circle cx="320" cy="350" r="110" stroke="#6ce1b5" stroke-width="2" fill="none"/>
<circle cx="430" cy="350" r="110" stroke="#6ce1b5" stroke-width="2" fill="none"/>
<circle cx="540" cy="350" r="110" stroke="#6ce1b5" stroke-width="2" fill="none"/>
<circle cx="650" cy="350" r="110" stroke="#6ce1b5" stroke-width="2" fill="none"/>
<circle cx="760" cy="350" r="125.3" stroke="#6ce1b5" stroke-width="2" fill="none"/>
<circle cx="885.3" cy="350" r="74.7004" stroke="#6ce1b5" stroke-width="2" fill="none"/>
<path d="M180 350L960 350" stroke="#ffd36f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<circle cx="210" cy="350" r="4" stroke="#ffd36f" stroke-width="2" fill="#ffd36f"/>
<circle cx="320" cy="350" r="4" stroke="#ffd36f" stroke-width="2" fill="#ffd36f"/>
<circle cx="430" cy="350" r="4" stroke="#ffd36f" stroke-width="2" fill="#ffd36f"/>
<circle cx="540" cy="350" r="4" stroke="#ffd36f" stroke-width="2" fill="#ffd36f"/>
<circle cx="650" cy="350" r="4" stroke="#ffd36f" stroke-width="2" fill="#ffd36f"/>
<circle cx="760" cy="350" r="4" stroke="#ffd36f" stroke-width="2" fill="#ffd36f"/>
<circle cx="885.3" cy="350" r="4" stroke="#ffd36f" stroke-width="2" fill="#ffd36f"/>
<text x="40" y="49" font-size="28" fill="#eef4ff" text-anchor="start">Distance fields turn empty space into safe steps</text>
<text x="40" y="588" font-size="16" fill="#a7b9d3" text-anchor="start">SCHEMATIC</text>
<text x="280" y="205" font-size="21" fill="#65baff" text-anchor="start">nearby ceiling bounds the early steps</text>
<text x="100" y="110" font-size="26" fill="#6ce1b5" text-anchor="start">step length ≈ distance to nearest surface</text>
<text x="990" y="260" font-size="23" fill="#65baff" text-anchor="start">wall</text>
<text x="90" y="515" font-size="22" fill="#eef4ff" text-anchor="start">Advance by one radius from each centre.</text>
<text x="90" y="544" font-size="22" fill="#eef4ff" text-anchor="start">A coarse or nonconservative field can step through a thin feature.</text>
</g></svg>
