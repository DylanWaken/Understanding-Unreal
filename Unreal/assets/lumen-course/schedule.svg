<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">A frame is a graph of dependencies</title><desc id="desc">Card lighting retains its own state; direct primary lighting, reconstructed indirect lighting and dedicated reflections meet at composition.</desc>
