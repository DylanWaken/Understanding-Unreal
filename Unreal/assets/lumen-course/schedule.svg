<text x="40" y="49" font-size="28" fill="#eef4ff" text-anchor="start">A frame is a graph of dependencies</text>
<text x="40" y="588" font-size="16" fill="#a7b9d3" text-anchor="start">SCHEMATIC · geometry and colors explain a model; this is not an Unreal buffer</text>
<text x="56" y="164" font-size="23" fill="#65baff" text-anchor="start">scene + card capture</text>
<text x="56" y="334" font-size="23" fill="#65baff" text-anchor="start">primary depth + material</text>
<text x="56" y="499" font-size="23" fill="#ffd36f" text-anchor="start">direct lights + VSM</text>
<text x="436" y="164" font-size="23" fill="#ffd36f" text-anchor="start">card lighting + radiosity</text>
<text x="436" y="198" font-size="19" fill="#a7b9d3" text-anchor="start">persistent secondary field</text>
<text x="436" y="324" font-size="23" fill="#6ce1b5" text-anchor="start">probes + world cache</text>
<text x="436" y="358" font-size="19" fill="#a7b9d3" text-anchor="start">demand → update → query</text>
<text x="436" y="494" font-size="23" fill="#c4a0ff" text-anchor="start">dedicated reflections</text>
<text x="911" y="319" font-size="23" fill="#eef4ff" text-anchor="start">compose + display</text>
<text x="911" y="353" font-size="19" fill="#a7b9d3" text-anchor="start">+ primary emission</text>
<text x="911" y="382" font-size="19" fill="#a7b9d3" text-anchor="start">matching units</text>
<text x="810" y="105" font-size="18" fill="#ffd36f" text-anchor="start">retained state</text>
</g></svg>
