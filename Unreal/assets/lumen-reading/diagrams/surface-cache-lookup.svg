<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" width="1100" height="780" role="img" aria-labelledby="title desc" data-schematic="true">
<title id="title">A hit becomes card UV, a page-table entry, and an atlas texel</title>
<desc id="desc">A world hit and normal select directional cards; card-local coordinates map to UV, the virtual page table resolves a mapped page and bias, and four atlas taps are weighted by bilinear and depth-validity terms. Schematic; the captured replay resolves one real texel.</desc>
