<text x="36" y="54" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#22312d" font-weight="600" text-anchor="start">A hit becomes card UV, a page-table entry, and an atlas texel</text>
<text x="36" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#586760" font-weight="400" text-anchor="start">World point → card space → virtual page → physical atlas → four weighted taps. One real texel is resolved in the replay.</text>
