<text x="860" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#93661e" font-weight="400" text-anchor="start">old sample</text>
<path d="M882 280L928 320" fill="none" stroke="#aa5343" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow-red)"/>
<circle cx="928" cy="320" r="5" fill="#aa5343" stroke="#aa5343" stroke-width="1.5"/>
<text x="890" y="456" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#aa5343" font-weight="400" text-anchor="start">depth mismatch → reject</text>
<circle cx="882" cy="232" r="5" fill="#286c56" stroke="#286c56" stroke-width="1.5"/>
<text x="858" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#286c56" font-weight="400" text-anchor="start">same plane</text>
<path d="M882 232L920 232" fill="none" stroke="#286c56" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow-green)"/>
<text x="900" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#286c56" font-weight="400" text-anchor="start">accept</text>
<text x="806" y="398" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#586760" font-weight="400" text-anchor="start">History is correlated reconstruction state,</text>
<text x="806" y="418" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#586760" font-weight="400" text-anchor="start">not another independent Monte Carlo sample.</text>
<rect x="36" y="552" width="320" height="152" rx="8" fill="#f8f8f2" stroke="#c4cec7" stroke-width="1.5" opacity="1"/>
<text x="52" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#286c56" font-weight="600" text-anchor="start">What is rejected</text>
<text x="52" y="608" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#22312d" font-weight="400" text-anchor="start">depth difference above the relative threshold</text>
<text x="52" y="631" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#22312d" font-weight="400" text-anchor="start">normal dot below the normal threshold</text>
<text x="52" y="654" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#22312d" font-weight="400" text-anchor="start">invalid current sample changes the blend</text>
<rect x="390" y="552" width="320" height="152" rx="8" fill="#f8f8f2" stroke="#c4cec7" stroke-width="1.5" opacity="1"/>
<text x="406" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#286c56" font-weight="600" text-anchor="start">What is retained</text>
<text x="406" y="608" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#22312d" font-weight="400" text-anchor="start">the reprojected coordinate and 2×2 taps</text>
<text x="406" y="631" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#22312d" font-weight="400" text-anchor="start">the previous count and exposure ratio</text>
<text x="406" y="654" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#22312d" font-weight="400" text-anchor="start">the validity mask, not just a color</text>
<rect x="744" y="552" width="320" height="152" rx="8" fill="#f8f8f2" stroke="#c4cec7" stroke-width="1.5" opacity="1"/>
<text x="760" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#286c56" font-weight="600" text-anchor="start">What to inspect</text>
<text x="760" y="608" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#22312d" font-weight="400" text-anchor="start">validity mask and previous count</text>
<text x="760" y="631" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#22312d" font-weight="400" text-anchor="start">exposure correction and clamp bounds</text>
<text x="760" y="654" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#22312d" font-weight="400" text-anchor="start">alpha and the effective history length</text>
<path d="M36 716L1064 716" fill="none" stroke="#c4cec7" stroke-width="1"/>
<text x="36" y="740" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#586760" font-weight="400" text-anchor="start">Schematic. Real Lumen screen-probe history uses at most 10 frames; distance threshold 0.01 (0.03 foliage), normal threshold 45°.</text>
