<text x="496" y="134" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#93661e" font-weight="600" text-anchor="start">2D · count-dependent blend</text>
<rect x="506" y="154" width="248" height="58" rx="6" fill="#fffdf8" stroke="#93661e" stroke-width="1.5" opacity="1"/>
<text x="520" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#93661e" font-weight="600" text-anchor="start">L(t−1) history</text>
<text x="520" y="198" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#586760" font-weight="400" text-anchor="start">reprojected + validity</text>
<rect x="506" y="228" width="248" height="58" rx="6" fill="#fffdf8" stroke="#93661e" stroke-width="1.5" opacity="1"/>
<text x="520" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#93661e" font-weight="600" text-anchor="start">exposure conversion</text>
<text x="520" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#586760" font-weight="400" text-anchor="start">PrevSceneColorPreExposureCorrection</text>
<rect x="506" y="302" width="248" height="58" rx="6" fill="#fffdf8" stroke="#286c56" stroke-width="1.5" opacity="1"/>
<text x="520" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#286c56" font-weight="600" text-anchor="start">current L(t)</text>
<text x="520" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#586760" font-weight="400" text-anchor="start">new sample + validity</text>
<rect x="506" y="436" width="248" height="58" rx="6" fill="#fffdf8" stroke="#93661e" stroke-width="1.5" opacity="1"/>
<text x="520" y="460" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#93661e" font-weight="600" text-anchor="start">L(out)</text>
<text x="520" y="480" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#586760" font-weight="400" text-anchor="start">write history + new count</text>
<path d="M630 212L630 226" fill="none" stroke="#93661e" stroke-width="2" marker-end="url(#arrow-gold)"/>
<path d="M630 286L630 300" fill="none" stroke="#93661e" stroke-width="2" marker-end="url(#arrow-gold)"/>
<path d="M630 360L630 434" fill="none" stroke="#93661e" stroke-width="2" marker-end="url(#arrow-gold)"/>
<rect x="506" y="378" width="248" height="30" rx="5" fill="#f0f1e9" stroke="#c4cec7" stroke-width="1" opacity="1"/>
<text x="518" y="402" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#22312d" font-weight="400" text-anchor="start">N′ = min(N + 1, N_max)</text>
<rect x="506" y="506" width="248" height="30" rx="5" fill="#f0f1e9" stroke="#c4cec7" stroke-width="1" opacity="1"/>
<text x="518" y="530" font-family="Cascadia Code, Consolas, monospace" font-size="10" fill="#22312d" font-weight="400" text-anchor="start">α = 1/(1 + N′)  ·  invalid current: 1/(1 + 4N′)</text>
<rect x="794" y="104" width="270" height="424" rx="8" fill="#f8f8f2" stroke="#c4cec7" stroke-width="1.5" opacity="1"/>
