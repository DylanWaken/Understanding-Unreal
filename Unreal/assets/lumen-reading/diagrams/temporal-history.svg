<text x="346" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#aa5343" font-weight="400" text-anchor="start">current pixel</text>
<rect x="119" y="186" width="28" height="26" rx="2" fill="#286c56" stroke="#286c56" stroke-width="1.5" opacity="0.22"/>
<rect x="119" y="216" width="28" height="26" rx="2" fill="#286c56" stroke="#286c56" stroke-width="1.5" opacity="0.22"/>
<rect x="153" y="186" width="28" height="26" rx="2" fill="#286c56" stroke="#286c56" stroke-width="1.5" opacity="0.22"/>
<rect x="153" y="216" width="28" height="26" rx="2" fill="#286c56" stroke="#286c56" stroke-width="1.5" opacity="0.22"/>
<text x="90" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#286c56" font-weight="600" text-anchor="start">2×2 depth taps</text>
<text x="90" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#586760" font-weight="400" text-anchor="start">depth Δ ≤ threshold</text>
<text x="90" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#586760" font-weight="400" text-anchor="start">normal dot ≥ cos(45°)</text>
<text x="90" y="374" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#586760" font-weight="400" text-anchor="start">Accepted taps are exposure-corrected before blending.</text>
<text x="90" y="394" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#aa5343" font-weight="400" text-anchor="start">A rejected tap is not zero radiance; it is no usable history.</text>
